{% extends "base.html" %}
{% block title %}Registro · TechGear{% endblock %}
{% block content %}
<style>
  .box h2{
    margin:0 0 6px;font-size:1.6rem;letter-spacing:-.5px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .box .sub{margin:0 0 8px;color:var(--muted);font-size:.9rem}
  .box button{width:100%;margin-top:22px}
  .box .alt{margin:20px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
  .box .alt a{color:var(--accent);text-decoration:none;font-weight:500}
  .box .alt a:hover{text-decoration:underline}
</style>

<form class="box" method="post">
  {% csrf_token %}
  <h2>Crear cuenta</h2>
  <p class="sub">Únete a TechGear en unos segundos</p>

  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" minlength="2" required>

  <label for="email">Correo</label>
  <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

  <label for="password">Contraseña (mín. 6)</label>
  <input type="password" id="password" name="password" placeholder="••••••••" minlength="6" maxlength="72" required>

  <button type="submit">Registrarme</button>
  <p class="alt">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</form>
{% endblock %}
