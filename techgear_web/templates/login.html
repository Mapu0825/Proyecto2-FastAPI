{% extends "base.html" %}
{% block title %}Iniciar sesión · TechGear{% endblock %}
{% block content %}
<style>
  .box h2{
    margin:0 0 6px;font-size:1.6rem;letter-spacing:-.5px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .box .sub{margin:0 0 8px;color:var(--muted);font-size:.9rem}

  /* Selector de rol tipo pastilla */
  .roles{display:flex;gap:10px;margin-top:8px}
  .roles label.rol{
    flex:1;margin:0;cursor:pointer;position:relative;
  }
  .roles input{position:absolute;opacity:0;pointer-events:none;width:auto;padding:0;margin:0}
  .roles span{
    display:block;text-align:center;padding:11px 8px;border-radius:10px;
    background:var(--bg);border:1px solid var(--border);color:var(--muted);
    font-weight:500;transition:all .2s;
  }
  .roles label.rol:hover span{border-color:var(--accent);color:var(--text)}
  .roles input:checked + span{
    background:var(--surface-2);border-color:var(--accent);color:var(--accent);
    box-shadow:0 0 0 3px #22d3ee22;
  }
  .roles input:focus-visible + span{box-shadow:0 0 0 3px #22d3ee55}

  .box button{width:100%;margin-top:22px}
  .box .alt{margin:20px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
  .box .alt a{color:var(--accent);text-decoration:none;font-weight:500}
  .box .alt a:hover{text-decoration:underline}
</style>

<form class="box" method="post">
  {% csrf_token %}
  <h2>Iniciar sesión</h2>
  <p class="sub">Bienvenido de nuevo a TechGear</p>

  <label>Entrar como</label>
  <div class="roles">
    <label class="rol">
      <input type="radio" name="rol" value="cliente" checked>
      <span>Cliente</span>
    </label>
    <label class="rol">
      <input type="radio" name="rol" value="administrador">
      <span>Administrador</span>
    </label>
  </div>

  <label for="email">Correo</label>
  <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

  <label for="password">Contraseña</label>
  <input type="password" id="password" name="password" placeholder="••••••••" required>

  <button type="submit">Entrar</button>
  <p class="alt">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
</form>
{% endblock %}
