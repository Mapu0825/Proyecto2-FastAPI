{% extends "base.html" %}
{% block title %}Nuevo producto · TechGear{% endblock %}
{% block content %}
<style>
  .box{max-width:520px}
  .box h2{
    margin:0 0 6px;font-size:1.6rem;letter-spacing:-.5px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .box .sub{margin:0 0 8px;color:var(--muted);font-size:.9rem}

  /* Precio y stock lado a lado */
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:480px){.fila{grid-template-columns:1fr}}

  .box button{width:100%;margin-top:22px}
  .box .alt{margin:20px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
  .box .alt a{color:var(--accent);text-decoration:none;font-weight:500}
  .box .alt a:hover{text-decoration:underline}
</style>

<form class="box" method="post">
  {% csrf_token %}
  <h2>Nuevo producto</h2>
  <p class="sub">Agrega un artículo al catálogo de TechGear</p>

  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" placeholder="Ej. Teclado mecánico RGB" minlength="2" maxlength="100" required>

  <label for="descripcion">Descripción</label>
  <input type="text" id="descripcion" name="descripcion" placeholder="Breve descripción del producto" maxlength="500" required>

  <div class="fila">
    <div>
      <label for="precio">Precio</label>
      <input type="number" id="precio" name="precio" placeholder="0.00" min="0.01" step="0.01" required>
    </div>
    <div>
      <label for="stock">Stock</label>
      <input type="number" id="stock" name="stock" placeholder="0" min="0" step="1" required>
    </div>
  </div>

  <label for="categoria">Categoría</label>
  <input type="text" id="categoria" name="categoria" placeholder="Ej. Periféricos" minlength="2" required>

  <label for="imagen_url">URL de imagen (opcional)</label>
  <input type="url" id="imagen_url" name="imagen_url" placeholder="https://...">

  <button type="submit">Guardar producto</button>
  <p class="alt"><a href="{% url 'catalogo' %}">← Volver al catálogo</a></p>
</form>
{% endblock %}
